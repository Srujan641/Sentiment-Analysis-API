groups:
  - name: sentiment-api
    rules:
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path="/api/v1/predict"}[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 /predict latency above 500 ms for 10 minutes"

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 2% of requests are failing"

      - alert: PredictionDrift
        expr: max(sentiment_drift_psi) > 0.25
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "PSI > 0.25 against the training reference: investigate and consider retraining"

      - alert: ConfidenceDropping
        expr: |
          sum(rate(sentiment_prediction_confidence_sum[1h])) / clamp_min(sum(rate(sentiment_prediction_confidence_count[1h])), 1e-9) < 0.8
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "Mean prediction confidence below 0.8 for 2 hours"

      - alert: ModelNotLoaded
        expr: sentiment_model_loaded == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "The API is up but the model is not loaded"
