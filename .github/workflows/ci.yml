name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  QUICKSTART_MODEL: distilbert/distilbert-base-uncased-finetuned-sst-2-english

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install ruff black isort
      - run: ruff check .
      - run: black --check .
      - run: isort --check-only .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: models/distilbert-sentiment
          key: model-v3-${{ env.QUICKSTART_MODEL }}
      - name: Fetch model weights
        run: |
          if [ ! -f models/distilbert-sentiment/model.safetensors ]; then
            pip install "huggingface_hub>=0.34"
            hf download "$QUICKSTART_MODEL" config.json model.safetensors tokenizer_config.json vocab.txt \
              --local-dir models/distilbert-sentiment
            # That repo ships only vocab.txt; it was fine-tuned from distilbert-base-uncased, whose
            # fast-tokenizer file is identical, and Transformers 5 needs tokenizer.json to load.
            hf download distilbert/distilbert-base-uncased tokenizer.json \
              --local-dir models/distilbert-sentiment
          fi
          ls -la models/distilbert-sentiment
          test -f models/distilbert-sentiment/config.json
          test -f models/distilbert-sentiment/tokenizer.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: sentiment-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and call it
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/models:/app/models:ro" sentiment-api:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ready && break
            sleep 2
          done
          curl -sf http://localhost:8000/ready
          curl -sf -X POST http://localhost:8000/api/v1/predict \
            -H 'Content-Type: application/json' \
            -d '{"text": "Best product I have ever bought!"}' | tee /tmp/out.json
          grep -q '"label":"POSITIVE"' /tmp/out.json
          curl -sf http://localhost:8000/metrics | grep -q sentiment_predictions_total
      - if: failure()
        run: docker logs api
