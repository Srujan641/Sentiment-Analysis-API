[project]
name = "sentiment-analysis-api"
version = "1.0.0"
description = "Fine-tuned DistilBERT sentiment classifier served with FastAPI"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["app", "scripts", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "BLE"]
ignore = ["B008", "E501"]  # Depends() in defaults is idiomatic; black owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
